version: 2

models:
  - name: fact_trips  
    description: "A model to store facts about the NYC taxi"
    columns:
      - name: tripid  
        description: "the unique identifier for each trip"
        tests:
          - unique
          - not_null

      - name: service_type
        description: "the type of service for the trip (e.g., Yellow, Green)"    
        tests:
          - accepted_values:
              values: ['Yellow', 'Green'] 